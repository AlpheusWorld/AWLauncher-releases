import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins { id 'java' }
group = 'ru.aw'
version = '0.1.0'
def gameVersion = providers.gradleProperty('gameVersion').getOrElse('26.1.2')
def releases = [
    '26.1.2': ['4e618f09a0c649dde3fdf829df443ce0b8831e65', '0.155.3+26.1.2'],
    '26.3': ['e877b6a07acd633fb3bb475002175cec036e7b87', '0.162.0+26.3']
]
if (!releases.containsKey(gameVersion)) throw new GradleException('Unsupported AWAssistant game version')
def apiVersion = releases[gameVersion][1]
sourceSets.main.java.srcDir("src/versions/${gameVersion}/java")
repositories { mavenCentral(); maven { url 'https://maven.fabricmc.net/' }; maven { url 'https://libraries.minecraft.net/' } }
def gameJar = layout.buildDirectory.file("minecraft/${gameVersion}.jar")
def gameApi = configurations.create('gameApi') { transitive = false }
dependencies {
    compileOnly files(gameJar)
    compileOnly 'net.fabricmc:fabric-loader:0.19.3'
    compileOnly 'com.google.code.gson:gson:2.13.2'
    compileOnly 'com.mojang:brigadier:1.3.10'
    compileOnly 'com.mojang:datafixerupper:9.0.19'
    compileOnly 'org.joml:joml:1.10.8'
    compileOnly 'org.lwjgl:lwjgl:3.4.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    add("gameApi", "net.fabricmc.fabric-api:fabric-api:${apiVersion}")
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
def modules = layout.buildDirectory.dir("fabric-modules/${gameVersion}")
def selectedModules = ['fabric-api-base-', 'fabric-key-mapping-api-v1-', 'fabric-lifecycle-events-v1-', 'fabric-resource-loader-v1-']
def prepareGame = tasks.register('prepareGame') {
    inputs.property('gameVersion', gameVersion)
    outputs.file(gameJar)
    outputs.dir(modules)
    doLast {
        def file = gameJar.get().asFile
        file.parentFile.mkdirs()
        if (!file.exists() || MessageDigest.getInstance('SHA-1').digest(file.bytes).encodeHex().toString() != releases[gameVersion][0]) {
            def source = rootProject.file("../build/client-mod-tooling/minecraft-${gameVersion}.jar")
            if (source.exists()) file.bytes = source.bytes
            else new URL("https://piston-data.mojang.com/v1/objects/${releases[gameVersion][0]}/client.jar").withInputStream { input -> file.withOutputStream { it << input } }
            if (MessageDigest.getInstance('SHA-1').digest(file.bytes).encodeHex().toString() != releases[gameVersion][0]) throw new GradleException('Minecraft compile-only jar checksum mismatch')
        }
        def output = modules.get().asFile
        output.mkdirs()
        new ZipFile(gameApi.singleFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name.tokenize('/').last()
                if (entry.name.startsWith('META-INF/jars/') && name.endsWith('.jar') && selectedModules.any { name.startsWith(it) }) {
                    new File(output, name).bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                }
            }
        }
    }
}
dependencies { compileOnly files(provider { fileTree(modules.get().asFile).matching { include '*.jar' }.files }) }
tasks.compileJava {
    dependsOn prepareGame
    options.encoding = 'UTF-8'
    options.fork = true
    def sdk = providers.gradleProperty('java25Home').orElse(providers.environmentVariable('AW_JAVA25_HOME'))
    options.forkOptions.executable = sdk.map { "${it}/bin/javac${System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''}" }.get()
    options.release = 25
}
tasks.compileTestJava { options.encoding = 'UTF-8'; options.fork = true; options.forkOptions.executable = tasks.compileJava.options.forkOptions.executable; options.release = 25 }
tasks.test {
    useJUnitPlatform()
    executable = tasks.compileJava.options.forkOptions.executable.replace('javac', 'java')
}
tasks.processResources {
    dependsOn prepareGame
    inputs.property('gameVersion', gameVersion)
    doLast {
        def info = [schemaVersion: 1, id: 'awassistant', version: project.version.toString(), name: 'AWAssistant',
            description: 'Внутриигровой поиск правил серверов Minecraft', environment: 'client', license: 'MIT',
            entrypoints: [client: ['ru.aw.assistant.AWAssistant']], icon: 'assets/awassistant/icon.png',
            depends: [fabricloader: '>=0.19.3', minecraft: gameVersion, java: '>=25'],
            jars: fileTree(modules.get().asFile).matching { include '*.jar' }.files.sort { it.name }.collect { [file: "META-INF/jars/${it.name}"] }]
        new File(destinationDir, 'fabric.mod.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(info))
    }
}
tasks.jar {
    dependsOn prepareGame
    archiveBaseName = "AWAssistant-fabric-${gameVersion}"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(modules) { into 'META-INF/jars'; include '*.jar' }
    from('../LICENSE') { rename { 'LICENSE-AWAssistant' } }
    from('../src/main/resources/fonts/Onest-OFL.txt') { into 'META-INF/licenses'; rename { 'Onest-OFL.txt' } }
    from('../src/main/resources/fonts/Onest-Medium.ttf') { into 'assets/awassistant/font'; rename { 'onest.ttf' } }
    from('../branding/AWLauncher-mark.png') { into 'assets/awassistant'; rename { 'icon.png' } }
}

sourceSets {
    testClient {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.named('compileTestClientJava') {
    dependsOn tasks.classes
    options.encoding = 'UTF-8'; options.fork = true
    options.forkOptions.executable = tasks.compileJava.options.forkOptions.executable
    options.release = 25
}
tasks.register('smokeJar', Jar) {
    dependsOn tasks.named('testClientClasses')
    archiveBaseName = "AWAssistant-smoke-${gameVersion}"
    from sourceSets.testClient.output
    def smokeInfo = layout.buildDirectory.dir('smoke-info')
    doFirst {
        def folder=smokeInfo.get().asFile;folder.mkdirs()
        new File(folder,'fabric.mod.json').text=groovy.json.JsonOutput.toJson([schemaVersion:1,id:'awassistant_test',version:'1',environment:'client',
            entrypoints:[client:['ru.aw.assistant.AssistantClientSmoke']],depends:[awassistant:'*']])
    }
    from(smokeInfo)
}
