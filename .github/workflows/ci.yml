name: CI

on:
  push:
    branches: [main, codex/retire-jvm]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test native UI
        run: |
          cargo test --locked --manifest-path rust/engine/Cargo.toml
          cargo test --locked --manifest-path rust/ui/Cargo.toml
          cargo test --locked --manifest-path rust/tauri/Cargo.toml
          cd rust/tauri
          npm ci
          npx playwright install chromium
          npm test

      - name: Run tests
        run: .\gradlew.bat test nativeBackendSmoke --no-daemon

      - name: Build Windows installers
        run: .\gradlew.bat packageDistributionForCurrentOS -PnoDeploy --no-daemon

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install desktop and packaging dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 xvfb libgl1 libegl1 libgtk-3-dev libwebkit2gtk-4.1-dev libxrender1 libxtst6 libxi6 libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev pkg-config rpm fakeroot desktop-file-utils pkexec

      - name: Test Rust and Secret Service on Linux
        timeout-minutes: 12
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          xvfb-run -a dbus-run-session -- bash -euc '
            printf "awlauncher-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            export AW_ENGINE_TEST_JDK="$JAVA_HOME"
            cargo test --locked --manifest-path rust/engine/Cargo.toml -- --include-ignored
          '

      - name: Build DEB and RPM without a JVM payload
        run: |
          chmod +x gradlew
          ./gradlew packageDistributionForCurrentOS -PnoDeploy --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
          if dpkg-deb -c build/compose/binaries/main/deb/*.deb | grep -E '\.jar$|/lib/runtime/'; then
            echo "Unexpected JVM payload in DEB"
            exit 1
          fi

      - name: Verify the installed Linux application starts
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Xvfb has no hardware compositor; keep this confined to the smoke test.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          sudo mkdir -p /usr/share/desktop-directories
          sudo dpkg --install build/compose/binaries/main/deb/*.deb
          app_binary=$(dpkg -L awlauncher | awk '/\/bin\/AWLauncher$/ { print; exit }')
          test -n "$app_binary"
          xvfb-run -a dbus-run-session -- python3 -u tools/tests/rust_linux_smoke.py "$app_binary" --minecraft

      - name: Retain Linux packages and test results
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm
            build/reports/tests/test/
          if-no-files-found: error
