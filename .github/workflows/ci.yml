name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test native UI
        run: cargo test --locked --manifest-path rust/ui/Cargo.toml

      - name: Run tests
        run: .\gradlew.bat test nativeBackendSmoke --no-daemon

      - name: Build Windows installers
        run: .\gradlew.bat packageDistributionForCurrentOS -PnoDeploy --no-daemon

  verify-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install desktop and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 xvfb libgl1 libegl1 libgtk-3-0 libxrender1 libxtst6 libxi6 libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev pkg-config rpm fakeroot desktop-file-utils pkexec

      - name: Test Linux integrations and build DEB and RPM
        run: |
          chmod +x gradlew
          dbus-run-session -- bash -euc '
            printf "awlauncher-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a ./gradlew test packageDistributionForCurrentOS -PnoDeploy --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
          '

      - name: Verify the installed Linux application starts
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo mkdir -p /usr/share/desktop-directories
          sudo dpkg --install build/compose/binaries/main/deb/*.deb
          app_binary=$(dpkg -L awlauncher | awk '/\/bin\/AWLauncher$/ { print; exit }')
          test -n "$app_binary"
          set +e
          timeout -k 5s 30s xvfb-run -a "$app_binary"
          status=$?
          set -e
          test "$status" -eq 124 -o "$status" -eq 0
          grep -R -F 'startup: native launcher ready' "$HOME/.aw/logs"

      - name: Retain Linux packages and test results
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm
            build/reports/tests/test/
          if-no-files-found: error
