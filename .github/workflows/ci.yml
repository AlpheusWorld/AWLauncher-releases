name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: .\gradlew.bat test --no-daemon

      - name: Build Windows installers
        run: .\gradlew.bat packageDistributionForCurrentOS -PnoDeploy --no-daemon
