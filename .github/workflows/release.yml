name: Verified desktop release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['releases/*.md']
  workflow_dispatch:

# A committed release note on main publishes the signed feed used by the Update button.
concurrency:
  group: awlauncher-windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  companions:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pinned Java 25 companion compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'awassistant-jdk25.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'awassistant-jdk25'
          Invoke-WebRequest -Uri 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_windows_hotspot_25.0.4.1_1.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '00c847d804f4a78e9f04f2683faf14fed898535b177b7fc704486cb0284e9283') {
            throw 'Companion JDK checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $compiler = Join-Path $destination 'jdk-25.0.4.1+1'
          if (-not (Test-Path -LiteralPath (Join-Path $compiler 'bin/javac.exe'))) { throw 'Companion compiler was not extracted' }
          "AW_JAVA25_HOME=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and verify client companions
        shell: pwsh
        run: |
          foreach ($gameVersion in @('26.1.2', '26.3')) {
            .\gradlew.bat -p client-mod build "-PgameVersion=$gameVersion" --no-daemon
            if ($LASTEXITCODE -ne 0) { throw "Client companion build failed: $gameVersion" }
          }

      - name: Pin companion files produced by this release
        id: pin
        shell: pwsh
        run: |
          $path = 'src/main/resources/companion/catalog.json'
          $catalog = @(Get-Content -LiteralPath $path -Raw | ConvertFrom-Json)
          foreach ($entry in $catalog) {
            $name = ([Uri]$entry.url).Segments[-1]
            $jar = Join-Path $PWD "client-mod/build/libs/$name"
            $zip = [IO.Compression.ZipFile]::OpenRead($jar)
            try {
              $infoEntry = $zip.GetEntry('fabric.mod.json')
              if (-not $infoEntry) { throw "Missing companion metadata: $name" }
              $reader = [IO.StreamReader]::new($infoEntry.Open())
              try { $info = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            } finally { $zip.Dispose() }
            if ($info.id -ne 'awassistant' -or $info.version -ne $entry.version -or $info.depends.minecraft -ne $entry.gameVersion) {
              throw "Unexpected companion build: $name"
            }
            $entry.size = (Get-Item -LiteralPath $jar).Length
            $entry.sha1 = (Get-FileHash -LiteralPath $jar -Algorithm SHA1).Hash.ToLowerInvariant()
            $entry.sha256 = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          [IO.File]::WriteAllText((Join-Path $PWD $path), ($catalog | ConvertTo-Json -Depth 5) + "`n", [Text.UTF8Encoding]::new($false))
          if (git status --porcelain -- $path) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Could not check release branch' }
            if ((git rev-parse origin/main) -ne $env:GITHUB_SHA) { throw 'Release branch changed during the build' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- $path
            git diff --cached --quiet -- $path
            if ($LASTEXITCODE -eq 1) {
              git commit -m 'Pin companion checksums from release build'
              if ($LASTEXITCODE -ne 0) { throw 'Could not record companion catalog' }
              git push origin HEAD:main
              if ($LASTEXITCODE -ne 0) { throw 'Could not publish companion catalog' }
            } elseif ($LASTEXITCODE -ne 0) { throw 'Could not compare companion catalog' }
          }
          "commit=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Retain companion build for verification
        uses: actions/upload-artifact@v4
        with:
          name: companion-build
          path: client-mod/build/libs/AWAssistant-fabric-*.jar
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: companions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AW_MS_CLIENT_ID: ${{ vars.AW_MS_CLIENT_ID }}
      AW_DISCORD_APP_ID: ${{ vars.AW_DISCORD_APP_ID }}
      AW_CURSEFORGE_API_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.companions.outputs.commit }}
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 xvfb libgl1 libegl1 libgtk-3-0 libxrender1 libxtst6 libxi6 rpm fakeroot desktop-file-utils pkexec
      - name: Verify and package Linux
        run: |
          chmod +x gradlew
          dbus-run-session -- bash -euc '
            printf "awlauncher-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a ./gradlew test packageDistributionForCurrentOS -PnoDeploy --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
          '
      - name: Verify the installed Linux application starts
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo mkdir -p /usr/share/desktop-directories
          sudo dpkg --install build/compose/binaries/main/deb/*.deb
          app_binary=$(dpkg -L awlauncher | awk '/\/bin\/AWLauncher$/ { print; exit }')
          test -n "$app_binary"
          set +e
          timeout -k 5s 30s xvfb-run -a "$app_binary"
          status=$?
          set -e
          test "$status" -eq 124 -o "$status" -eq 0
          grep -R -F 'startup: launcher ready' "$HOME/.aw/logs"

      - name: Retain Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  release:
    needs: [companions, linux]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AW_MS_CLIENT_ID: ${{ vars.AW_MS_CLIENT_ID }}
      AW_SIGNER_THUMBPRINT: ${{ vars.AW_SIGNER_THUMBPRINT }}
      AW_UPDATE_URL: ${{ vars.AW_UPDATE_URL }}
      AW_DISCORD_APP_ID: ${{ vars.AW_DISCORD_APP_ID }}
      # The shared CurseForge key stays on the server, outside public installers.
      AW_CURSEFORGE_API_KEY: ''
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      AW_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.AW_UPDATE_SIGNING_PRIVATE_KEY }}
      AW_PUBLIC_RELEASE_TOKEN: ${{ secrets.AW_PUBLIC_RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.companions.outputs.commit }}

      - name: Set up release uploader
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate release credentials and version
        shell: pwsh
        run: |
          foreach ($name in @('AW_UPDATE_SIGNING_PRIVATE_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions variable or secret: $name"
            }
          }
          $projectVersion = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $tagVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $projectVersion }
          if ($tagVersion -ne $projectVersion) {
            throw "Release tag $tagVersion must match build.gradle.kts version $projectVersion"
          }

      - name: Retrieve verified companions
        uses: actions/download-artifact@v4
        with:
          name: companion-build
          path: client-mod/build/libs

      - name: Verify launcher and update integrity
        run: .\gradlew.bat test -PnoDeploy --no-daemon

      - name: Build Windows installers
        run: .\gradlew.bat validateReleaseConfiguration packageDistributionForCurrentOS -PnoDeploy --no-daemon

      - name: Sign and verify MSI and EXE
        if: env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'awlauncher-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found' }

          $packages = Get-ChildItem 'build/compose/binaries' -Recurse -File |
            Where-Object { $_.Name -like 'AWLauncher-*' -and $_.Extension -in @('.msi', '.exe') }
          if (-not $packages) { throw 'No AWLauncher MSI or EXE packages were produced' }
          $expectedThumbprint = $env:AW_SIGNER_THUMBPRINT.Replace(' ', '').ToUpperInvariant()

          foreach ($package in $packages) {
            & $signTool.FullName sign /f $certPath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($package.Name)" }
            & $signTool.FullName verify /pa /all /v $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($package.Name)" }

            $signature = Get-AuthenticodeSignature -LiteralPath $package.FullName
            if ($signature.Status.ToString() -ne 'Valid' -or $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant() -ne $expectedThumbprint) {
              throw "Unexpected signing certificate on $($package.Name)"
            }
          }

      - name: Retrieve Linux installers
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: build/linux-artifacts

      - name: Prepare signed public release bundle
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $notes = Join-Path $PWD "releases/$version.md"
          .\tools\prepare_release_sources.ps1 -Version $version
          .\tools\publish_release.ps1 -Version $version -Artifacts 'build/compose/binaries/main' -LinuxArtifacts 'build/linux-artifacts' -Notes $notes -PrepareOnly

      - name: Retain verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: public-release
          path: |
            build/publication/v*/*.exe
            build/publication/v*/*.msi
            build/publication/v*/*.deb
            build/publication/v*/*.rpm
            build/publication/v*/*.jar
            build/publication/v*/*.json
            build/publication/v*/*.sig
            build/publication/v*/*.txt
            build/publication/v*/*.zip
            build/publication/v*/*.tar.gz
            build/publication/v*/*.part??
            build/publication/v*/*.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish public release with repository-scoped credentials
        if: env.AW_PUBLIC_RELEASE_TOKEN != '' || github.repository == 'AlpheusWorld/AWLauncher-releases'
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          .\tools\publish_release.ps1 -Version $version -Artifacts 'build/compose/binaries/main' -LinuxArtifacts 'build/linux-artifacts' -Notes "releases/$version.md"
