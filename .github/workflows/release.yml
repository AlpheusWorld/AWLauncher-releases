name: Verified desktop release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['releases/*.md']
  workflow_dispatch:

# A committed release note on main publishes the signed feed used by the Update button.
concurrency:
  group: awlauncher-windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AW_MS_CLIENT_ID: ${{ vars.AW_MS_CLIENT_ID }}
      AW_DISCORD_APP_ID: ${{ vars.AW_DISCORD_APP_ID }}
      AW_CURSEFORGE_API_KEY: ''
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 xvfb libgl1 libegl1 libgtk-3-0 libxrender1 libxtst6 libxi6 libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev pkg-config rpm fakeroot desktop-file-utils pkexec
      - name: Verify and package Linux
        run: |
          chmod +x gradlew
          dbus-run-session -- bash -euc '
            printf "awlauncher-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a ./gradlew test packageDistributionForCurrentOS -PnoDeploy --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
          '
      - name: Verify the installed Linux application starts
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo mkdir -p /usr/share/desktop-directories
          sudo dpkg --install build/compose/binaries/main/deb/*.deb
          app_binary=$(dpkg -L awlauncher | awk '/\/bin\/AWLauncher$/ { print; exit }')
          test -n "$app_binary"
          set +e
          timeout -k 5s 30s xvfb-run -a "$app_binary"
          status=$?
          set -e
          test "$status" -eq 124 -o "$status" -eq 0
          grep -R -F 'startup: native launcher ready' "$HOME/.aw/logs"

      - name: Stage verified Linux installers in a draft release
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)
          stage="ci-$version-${GITHUB_SHA:0:7}"
          if ! gh release view "$stage" >/dev/null 2>&1; then
            gh release create "$stage" --draft --target "$GITHUB_SHA" --title "AWLauncher $version CI staging" --notes "Internal transfer of verified release assets."
          fi
          cp build/compose/binaries/main/deb/*.deb "$RUNNER_TEMP/AWLauncher-linux-x64.deb"
          cp build/compose/binaries/main/rpm/*.rpm "$RUNNER_TEMP/AWLauncher-linux-x64.rpm"
          gh release upload "$stage" "$RUNNER_TEMP/AWLauncher-linux-x64.deb" "$RUNNER_TEMP/AWLauncher-linux-x64.rpm" --clobber

  release:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AW_MS_CLIENT_ID: ${{ vars.AW_MS_CLIENT_ID }}
      AW_SIGNER_THUMBPRINT: ${{ vars.AW_SIGNER_THUMBPRINT }}
      AW_UPDATE_URL: ${{ vars.AW_UPDATE_URL }}
      AW_DISCORD_APP_ID: ${{ vars.AW_DISCORD_APP_ID }}
      # The shared CurseForge key stays on the server, outside public installers.
      AW_CURSEFORGE_API_KEY: ''
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      AW_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.AW_UPDATE_SIGNING_PRIVATE_KEY }}
      AW_PUBLIC_RELEASE_TOKEN: ${{ secrets.AW_PUBLIC_RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up release uploader
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate release credentials and version
        shell: pwsh
        run: |
          foreach ($name in @('AW_UPDATE_SIGNING_PRIVATE_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions variable or secret: $name"
            }
          }
          $projectVersion = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $tagVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $projectVersion }
          if ($tagVersion -ne $projectVersion) {
            throw "Release tag $tagVersion must match build.gradle.kts version $projectVersion"
          }

      - name: Verify launcher and update integrity
        run: .\gradlew.bat test nativeBackendSmoke -PnoDeploy --no-daemon

      - name: Build Windows installers
        run: .\gradlew.bat validateReleaseConfiguration packageDistributionForCurrentOS -PnoDeploy --no-daemon

      - name: Sign and verify MSI and EXE
        if: env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'awlauncher-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found' }

          $packages = Get-ChildItem 'build/compose/binaries' -Recurse -File |
            Where-Object { $_.Name -like 'AWLauncher-*' -and $_.Extension -in @('.msi', '.exe') }
          if (-not $packages) { throw 'No AWLauncher MSI or EXE packages were produced' }
          $expectedThumbprint = $env:AW_SIGNER_THUMBPRINT.Replace(' ', '').ToUpperInvariant()

          foreach ($package in $packages) {
            & $signTool.FullName sign /f $certPath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($package.Name)" }
            & $signTool.FullName verify /pa /all /v $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($package.Name)" }

            $signature = Get-AuthenticodeSignature -LiteralPath $package.FullName
            if ($signature.Status.ToString() -ne 'Valid' -or $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant() -ne $expectedThumbprint) {
              throw "Unexpected signing certificate on $($package.Name)"
            }
          }

      - name: Retrieve verified Linux installers from the draft release
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $stage = "ci-$version-$($env:GITHUB_SHA.Substring(0, 7))"
          gh release download $stage --pattern 'AWLauncher-linux-x64.deb' --pattern 'AWLauncher-linux-x64.rpm' --dir build/linux-artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Verified Linux installer download failed' }
          foreach ($format in @('deb', 'rpm')) {
            Move-Item -LiteralPath "build/linux-artifacts/AWLauncher-linux-x64.$format" -Destination "build/linux-artifacts/AWLauncher-$version-linux-x64.$format"
          }

      - name: Prepare signed public release bundle
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $notes = Join-Path $PWD "releases/$version.md"
          .\tools\prepare_release_sources.ps1 -Version $version
          .\tools\publish_release.ps1 -Version $version -Artifacts 'build/compose/binaries/main' -LinuxArtifacts 'build/linux-artifacts' -Notes $notes -PrepareOnly

      - name: Retain verified release assets in the draft release
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $stage = "ci-$version-$($env:GITHUB_SHA.Substring(0, 7))"
          $folder = "build/publication/v$version"
          $names = @('AWLauncher-Setup.exe', 'AWLauncher.msi', 'update.json', 'update.json.sig', 'SHA256SUMS.txt', 'AWLauncher-third-party-sources.zip', 'OpenJDK-sources.part01', 'OpenJDK-sources.part02', 'OpenJDK-SOURCES.md', 'AWLauncher-linux-x64.deb', 'AWLauncher-linux-x64.rpm', 'update-linux-deb-x64.json', 'update-linux-deb-x64.json.sig', 'update-linux-rpm-x64.json', 'update-linux-rpm-x64.json.sig')
          $assetPaths = $names | ForEach-Object {
            $path = Join-Path $folder $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing verified asset: $_" }
            (Resolve-Path -LiteralPath $path).Path
          }
          gh release upload $stage @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Verified release asset upload failed' }

      - name: Publish public release with repository-scoped credentials
        if: env.AW_PUBLIC_RELEASE_TOKEN != '' || github.repository == 'AlpheusWorld/AWLauncher-releases'
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content 'build.gradle.kts' -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          .\tools\publish_release.ps1 -Version $version -Artifacts 'build/compose/binaries/main' -LinuxArtifacts 'build/linux-artifacts' -Notes "releases/$version.md"
